name: Deploy to VS Code Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (patch, minor, major, or none)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  deploy:
    name: Build, Package & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bump Version (if manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'none'
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=v$NEW_VERSION" >> $GITHUB_ENV
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push
          git push --tags

      - name: Build Webview & Extension
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --no-dependencies --out drawboard.vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX (Optional)
        if: env.OVSX_PAT != ''
        run: npx ovsx publish drawboard.vsix -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || env.NEW_VERSION != ''
        with:
          tag_name: ${{ env.NEW_VERSION || github.ref_name }}
          name: Release ${{ env.NEW_VERSION || github.ref_name }}
          files: drawboard.vsix
          generate_release_notes: true
